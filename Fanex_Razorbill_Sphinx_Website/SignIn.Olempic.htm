<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Sign In</title>
    <link href="Resources/SignIn.Olempic.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div id="table_main">
        <center>
        <div id="center">            
            <form method="post" name="fLogin" action='{formAction}'>            
            <table class="mainBox" border="0" align="right" cellpadding="0" cellspacing="0">
                <tr>
                    <td style="width:360px; height:26px"></td>
                    <td></td>
                    <td valign="top">
                        <div id="lanEnUS" onclick="SelectLanguage(0)" title="English"></div>
                        <div id="lanZhTW" onclick="SelectLanguage(1)" title="繁體中文"></div>
                        <div id="lanZhCN" onclick="SelectLanguage(4)" title="简体中文"></div>
                        <div id="lanJaJP" onclick="SelectLanguage(2)" title="日本語"></div>
                        <div id="lanThTH" onclick="SelectLanguage(3)" title="ภาษาไทย"></div>
                        <div id="lanKoKR" onclick="SelectLanguage(5)" title="한국어"></div>
                        <div id="lanViVN" onclick="SelectLanguage(6)" title="Tiếng Việt"></div>
                        <input type="hidden" value="en-US" id="hidLanguage" name="hidLanguage" />
                    </td>
                </tr>
                <tr>
                    <td class="line" colspan="3"></td>
                </tr>
                <tr>
                    <td></td>
                    <td class="imgSignIn"></td>
                    <td height="25" align="left" valign="middle">
                        <table width="100%" border="0" cellpadding="3" cellspacing="0">
                            <tr>
                                <td class="mainErrMsg" align="left" valign="top" colspan="2">
                                    <div id="errmsg" class="errmsg"></div>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <span id="spnUserName"></span>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <input name="txtUserName" type="text" id="txtUserName" value="{username_value}"/>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2" style="padding-top:15px">
                                    <span id="spnPassWord"></span>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <input name="txtPassWord" id="txtPassWord" type="password" />
                                </td>
                            </tr>
                            <tr>
                                <td style="width:80px; padding-top:15px">
                                    <span id="spnCaptcha" style="font-weight: bold;"></span>
                                    <input id="txtCaptcha" name="txtCaptcha" type="text" style="width: 70px;" maxlength="4" autocomplete="off" onkeydown="DoEnter(event, 'DoLogin()')" />
                                </td>
                                <td align="left" valign="middle" onclick="GetValidateImage()" style="padding-top:20px">
                                    <img height="32" src="Handlers/Captcha.ashx" id="imgCode" alt="" />&nbsp;&nbsp;&nbsp;
                                    <img height="30" id="refreshIcon" onclick="GetValidateImage()" alt="Refresh" src="GlobalResources/Images.Olempic/refresh-icon.png" />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2" style="padding-top:15px">
                                    <input id="btnLogin" type="button" class="buttonsite" value="Login" onclick="return DoLogin()" />
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td align="right" valign="middle"></td>
                    <td align="right" valign="middle">                    
                        <div id="divBrowser" class="text_brow">Recommended Browsers:</div>   
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td colspan="3" align="center" valign="middle">
                        {VersionMobile}
                    </td>                    
                </tr>
            </table>
            </form>
            <p>&nbsp;</p>
        </div>
        </center>
    </div>
    <!--PopupMobileVersion-->     
    <!--/PopupMobileVersion-->    
</body>

<script src="../../GlobalResources/Js/Core.js" type="text/javascript"></script>

    <script src="Resources/SignIn.Olempic.js" type="text/javascript"></script>
    

</html>
